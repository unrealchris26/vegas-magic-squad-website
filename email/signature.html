<!--
  VEGAS MAGIC SQUAD — EMAIL SIGNATURE
  ============================================================================
  Paste the markup between the two SIGNATURE markers into the signature box in
  GoHighLevel, Gmail or Outlook.

  WHY THIS IS BUILT DIFFERENTLY FROM THE CONFIRMATION EMAIL

  A signature is not a template. It gets pasted into a compose window, so every
  rule a signature editor strips has to be avoided outright:

    - No <style> block, no classes, no media queries. Gmail and Outlook delete
      them on paste, so every style here is inline on the element.
    - No web font link. It would not survive either, so the stacks lead with
      Montserrat for the rare client that has it installed locally and fall
      straight through to Arial.
    - No dark page background. A signature sits inside a reply chain on white.
      The brand's near-black appears only as the small logo tile, which reads as
      a deliberate mark rather than a block of colour fighting the thread.
    - Text colours are dark-on-light for the same reason: in a quoted reply the
      ground is white and light text would vanish.

  Set up for Kent Axell. For another team member, change only the two lines
  holding the name and the title - everything else is shared.
-->

<!-- ================= SIGNATURE : COPY FROM HERE ================= -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-family:'Montserrat',Arial,Helvetica,sans-serif;">
  <tr>

    <!-- Logo. A separate file from the confirmation email's: that one is
         flattened onto the near-black it sits on, which would show as a dark
         rectangle here on a white thread. This is the mark on real
         transparency, so it works on a light compose window and on a dark one.

         It is a true RGBA PNG, NOT a palette PNG with a tRNS chunk - that
         combination renders on desktop and fails in several mobile clients,
         which is exactly what broke the logo in the confirmation email.

         Served at 2x (144x179) and displayed at 72x89 so it stays sharp on
         retina. Width and height are set as attributes AND inline, because
         Outlook reads the attributes and ignores the CSS. -->
    <td valign="top" style="padding:0 18px 0 0; vertical-align:top;">
      <a href="https://magicsquad.vegas" style="text-decoration:none; border:0;">
        <img src="https://vegas-magic-squad-website.vercel.app/images/site/signature-logo.png"
             width="72" height="89" alt="Vegas Magic Squad"
             style="display:block; width:72px; height:89px; border:0; outline:none; text-decoration:none;">
      </a>
    </td>

    <!-- A 1px gold rule as a table cell rather than a border: borders on
         adjacent cells get collapsed or dropped by several clients. -->
    <td style="width:1px; padding:0; background-color:#c8a850; font-size:0; line-height:0;">&nbsp;</td>

    <td valign="top" style="padding:0 0 0 18px; vertical-align:top;">
