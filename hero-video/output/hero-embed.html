<!--
  Hero background video - ready-to-paste snippet.

  Files (same folder as this snippet, or adjust the paths):
    hero-desktop.webm  hero-desktop.mp4  hero-poster-desktop.jpg
    hero-mobile.webm   hero-mobile.mp4   hero-poster-mobile.jpg

  The video is decoration: it carries no information, no text and no audio,
  so it is aria-hidden and never focusable. The headline and buttons stay
  live HTML inside .hero-content.

  <source media> on <video> is supported in current Chrome, Edge, Firefox and
  Safari. The script below also covers the poster per breakpoint, which the
  poster attribute cannot do on its own.
-->

<section class="hero">
  <video class="hero-bg" autoplay muted loop playsinline preload="metadata"
         poster="hero-poster-desktop.jpg" aria-hidden="true" tabindex="-1">
    <source media="(max-width: 768px)" src="hero-mobile.webm" type="video/webm">
    <source media="(max-width: 768px)" src="hero-mobile.mp4" type="video/mp4">
    <source src="hero-desktop.webm" type="video/webm">
    <source src="hero-desktop.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay" aria-hidden="true"></div>
  <div class="hero-content"><!-- existing headline + buttons --></div>
</section>

<style>
  .hero {
    position: relative;
    overflow: hidden;
    isolation: isolate;          /* keeps the z-index stack inside the hero */
    background: #07090f;         /* --night: what shows before the first frame */
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }
  /* Extra contrast insurance for the live text. The video already carries its
     own darkened headline zone; this deepens it toward the copy. */
  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(7, 9, 15, .75) 0%, rgba(7, 9, 15, 0) 65%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
  }
  @media (max-width: 768px) {
    .hero-overlay {
      background: linear-gradient(0deg, rgba(7, 9, 15, .75) 0%, rgba(7, 9, 15, 0) 60%);
    }
  }
</style>

<script>
  (function () {
    var video = document.querySelector('.hero-bg');
    if (!video) return;

    var mobile = window.matchMedia('(max-width: 768px)');
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)');

    // The poster for this breakpoint. The attribute alone can't switch.
    function pickPoster() {
      video.poster = mobile.matches ? 'hero-poster-mobile.jpg' : 'hero-poster-desktop.jpg';
    }

    // Reduced motion: no video at all, just the still. The poster becomes a
    // plain background on the hero so nothing moves and nothing downloads.
    function stillOnly() {
      var hero = video.closest('.hero');
      if (hero) {
        hero.style.backgroundImage = 'url(' + (mobile.matches ? 'hero-poster-mobile.jpg' : 'hero-poster-desktop.jpg') + ')';
        hero.style.backgroundSize = 'cover';
        hero.style.backgroundPosition = 'center';
      }
      video.remove();
    }

    if (calm.matches) { stillOnly(); return; }
    pickPoster();
    mobile.addEventListener('change', pickPoster);
    calm.addEventListener('change', function (e) { if (e.matches) stillOnly(); });

    // Off screen, stop decoding. Back on screen, resume.
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var p = video.play();
            if (p && p.catch) p.catch(function () {});   // autoplay can be refused; the poster stands
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.05 }).observe(video);
    }
  })();
</script>
