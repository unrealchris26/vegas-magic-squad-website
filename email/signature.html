<!--
  VEGAS MAGIC SQUAD — EMAIL SIGNATURE
  ============================================================================
  Paste the markup between the two SIGNATURE markers into the signature box in
  GoHighLevel, Gmail or Outlook.

  WHY IT CARRIES ITS OWN DARK BACKGROUND

  An earlier version was built dark-on-light, on the assumption a signature
  always lands in a white reply thread. That is wrong here: {{user.email_signature}}
  renders INSIDE the confirmation email, on #07090f. Dark text there is
  invisible.

  But the opposite is equally wrong - light text pasted into a white Gmail
  thread disappears just as completely. The two contexts cannot be served by
  one set of text colours.

  So the signature brings its own ground. It is a self-contained #07090f block,
  which means:
    - inside the confirmation email it is seamless, because that is the same
      colour as the email body
    - in a white reply chain it reads as a deliberate dark card rather than
      broken text
  Legibility is guaranteed in both without a media query, which matters because
  a signature editor would strip one anyway.

  Type matches the email exactly: the gold label at 11px / 2.2px tracking, the
  Josefin headline stack for the name, Montserrat for everything else, and the
  same five colours.

  OTHER CONSTRAINTS (a signature is pasted, not rendered from a template)
    - No <style>, no classes, no media queries. Gmail and Outlook delete them
      on paste, so every style is inline on the element.
    - No web-font <link>, same reason. The stacks lead with the brand faces for
      the rare client that has them locally, then fall through to Arial.
    - bgcolor attributes alongside the inline background-color: older Outlook
      reads the attribute and ignores the CSS.

  Set up for Kent Axell. For another team member, change only the name and
  title lines - everything else is shared.
-->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#07090f" style="border-collapse:collapse; background-color:#07090f;">
  <tr>
    <td style="padding:0;">

      <!-- Gold hairline across the top, the same rule the email uses under its
           nav and above its footer. Ties the block to the message it sits in,
           and gives it an edge when it lands on white instead. -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr><td height="1" bgcolor="#4a3f22" style="height:1px; line-height:1px; font-size:0; background-color:#4a3f22;">&nbsp;</td></tr>
      </table>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#07090f" style="border-collapse:collapse; background-color:#07090f;">
        <tr>

          <!-- Logo on real transparency, so it sits on this dark ground with no
               seam. A true RGBA PNG, NOT a palette PNG with a tRNS chunk -
               that combination renders on desktop and fails in several mobile
               clients. Served 2x (144x179), displayed 72x89. Dimensions as
               attributes AND inline: Outlook reads the attributes. -->
          <td valign="top" bgcolor="#07090f" style="padding:20px 18px 20px 0; vertical-align:top; background-color:#07090f;">
            <a href="https://magicsquad.vegas" style="text-decoration:none; border:0;">
              <img src="https://vegas-magic-squad-website.vercel.app/images/site/signature-logo.png"
                   width="72" height="89" alt="Vegas Magic Squad"
                   style="display:block; width:72px; height:89px; border:0; outline:none; text-decoration:none;">
            </a>
          </td>

          <!-- 1px gold rule as a cell, not a border: borders on adjacent cells
               get collapsed or dropped by several clients. -->
          <td bgcolor="#c8a850" style="width:1px; padding:0; background-color:#c8a850; font-size:0; line-height:0;">&nbsp;</td>

          <td valign="top" bgcolor="#07090f" style="padding:20px 0 20px 18px; vertical-align:top; background-color:#07090f;">

            <p style="margin:0 0 4px 0; font-family:'Josefin Sans','Century Gothic','Helvetica Neue',Arial,Helvetica,sans-serif; font-size:19px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; line-height:1.15; color:#e6d193;">
              Kent Axell
            </p>

            <p style="margin:0 0 12px 0; font-family:'Montserrat',Arial,Helvetica,sans-serif; font-size:11px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase; line-height:1.45; color:#c8a850;">
              Founder &amp; Executive Producer
            </p>

            <p style="margin:0 0 3px 0; font-family:'Montserrat',Arial,Helvetica,sans-serif; font-size:13px; line-height:1.65; color:#efe9dd;">
              <a href="mailto:kent@vegasmagicsquad.com" style="color:#efe9dd; text-decoration:none;">kent@vegasmagicsquad.com</a>
            </p>

            <p style="margin:0 0 10px 0; font-family:'Montserrat',Arial,Helvetica,sans-serif; font-size:13px; line-height:1.65; color:#efe9dd;">
              <a href="tel:+12074583115" style="color:#efe9dd; text-decoration:none;">(207) 458-3115</a>
            </p>

            <p style="margin:0 0 10px 0; font-family:'Montserrat',Arial,Helvetica,sans-serif; font-size:13px; line-height:1.65;">
              <a href="https://magicsquad.vegas" style="color:#e6d193; text-decoration:underline;">magicsquad.vegas</a>
              <span style="color:#a89c89;">&nbsp;&middot;&nbsp;</span>
              <a href="https://www.instagram.com/vegas_magic_squad/" style="color:#e6d193; text-decoration:underline;">Instagram</a>
            </p>

            <p style="margin:0; font-family:'Montserrat',Arial,Helvetica,sans-serif; font-size:11px; line-height:1.6; letter-spacing:0.3px; color:#a89c89;">
              Magicians for corporate events and private parties &middot; Las Vegas, Nevada
            </p>

          </td>
        </tr>
