  VEGAS MAGIC SQUAD — EMAIL SIGNATURE
  ============================================================================
  Paste the markup between the two SIGNATURE markers into the signature box in
  GoHighLevel, Gmail or Outlook.

  WHY THIS IS BUILT DIFFERENTLY FROM THE CONFIRMATION EMAIL

  A signature is not a template. It gets pasted into a compose window, so every
  rule a signature editor strips has to be avoided outright:

    - No <style> block, no classes, no media queries. Gmail and Outlook delete
      them on paste, so every style here is inline on the element.
    - No web font link. It would not survive either, so the stacks lead with
      Montserrat for the rare client that has it installed locally and fall
      straight through to Arial.
    - No dark page background. A signature sits inside a reply chain on white.
      The brand's near-black appears only as the small logo tile, which reads as
      a deliberate mark rather than a block of colour fighting the thread.
    - Text colours are dark-on-light for the same reason: in a quoted reply the
      ground is white and light text would vanish.

  FILL IN BEFORE USE:  [YOUR NAME]  ·  [YOUR TITLE]
  Everything else is already wired.
-->
